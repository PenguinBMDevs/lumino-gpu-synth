[package]
name = "lumino-gpu-synth"
version = "0.1.0"
edition = "2024"
description = "GPU-accelerated real-time MIDI audio synthesizer and offline renderer (SF2 via xsynth-soundfonts, wgpu compute shaders)"
license = "MIT OR Apache-2.0"
keywords = ["midi", "audio", "gpu", "wgpu", "soundfont"]
categories = ["multimedia::audio", "rendering::gpu"]

[dependencies]
wgpu = "27.0.1"
lumino-midly = "0.6.2"
xsynth-soundfonts = "0.4.0"
cpal = "0.18.1"
pollster = "0.4"
bytemuck = { version = "1.23", features = ["derive"] }
thiserror = "2.0"
rayon = "1.10"
sysinfo = { version = "0.39.6", features = ["system"] }
memmap2 = "0.9.11"

[profile.release]
opt-level = 3
